    <label style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 500">Work email</span>
      <input type="email" autocomplete="email" value="priya@acme.studio" style="height: 52px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid #0B0B0C; border-radius: 14px; font: inherit; font-size: 17px; color: #0B0B0C; background: #FFFFFF">
    </label>
    <label style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 500">Password</span>
